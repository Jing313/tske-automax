name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days of inactivity.
# This pings the REST API daily with a tiny read on the cars table.
# Note: a 3-day cadence was not enough to prevent a pause in practice
# (observed 2026-09), so this runs daily for more safety margin.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query cars table
        env:
          SUPABASE_URL: https://diahuhduggvoqfsfdunn.supabase.co
          # Public publishable key (replacement for the legacy anon JWT key)
          SUPABASE_KEY: sb_publishable_GyBJoQZRVmsshyPWj6fXrg_zWZjB45x
        run: |
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/cars?select=id&limit=1"
